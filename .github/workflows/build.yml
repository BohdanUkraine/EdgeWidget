# Builds the Windows installer, the macOS .dmg and the Linux AppImage; all land in the run's artifacts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # build.ps1 picks the generator for whichever Visual Studio the image has (2022 or 2026).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # package.ps1 runs build.ps1 first, then cmake --install into out\stage and ISCC.
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1 -QtDir "$env:QT_ROOT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeWidget-windows
          path: out/EdgeWidget-Setup-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      # No SIGN_IDENTITY: ad-hoc signature, no notarization.
      - name: Build and package
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeWidget-macos
          path: dist-mac/*.dmg
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu: the AppImage runs on its glibc and newer (Arch, Fedora, ...).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # libsecret: the keyring; the xcb / wayland / EGL libraries are what Qt's platform
      # plugins link against, linuxdeploy has to find them to bundle the plugins.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsecret-1-dev libgl1-mesa-dev libegl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build and package
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeWidget-linux
          path: dist-linux/*.AppImage
          if-no-files-found: error
